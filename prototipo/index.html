<title>Sistema Wingard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: painel lateral flutuante (3 departamentos = etapas 1→2→3) + barra superior fixa + área de trabalho em cards; no celular o painel vira faixa no topo. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --surface-3:#ECEEF3; --line:#E5E7EE; --line-2:#D3D7E1;
  --fg:#0E1220; --muted:#5D6478; --faint:#959BAC;
  --side:#FFFFFF; --side-2:#F2F3F7; --side-fg:#0E1220; --side-muted:#6A7186;
  --com:#3657F5; --ops:#EE6A1F; --fin:#0E9F73;
  --ok:#0E9F73; --warn:#D48800; --bad:#E2474F; --info:#3657F5;
  --av0:#3657F5; --av1:#0E9F73; --av2:#EE6A1F; --av3:#9B51E0; --av4:#E2477E;
  --z-risco:#F2B01E; --z-amassado:#E2474F; --z-trinca:#8B5CF6; --z-base:#EEF0F5; --z-stroke:#B3BACA;
  --on-acc:#FFFFFF; --scrim:rgba(8,10,16,.62); --deep:#0B1022;
  --paper:#FFFFFF; --ink:#1A1A1A; --ink-line:#BDBDBD;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.04);
  --shadow-md:0 2px 4px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);
  --shadow-lg:0 20px 50px rgba(16,24,40,.18);
  --f-display:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0C12; --surface:#12151E; --surface-2:#161A24; --surface-3:#1C2130; --line:#222838; --line-2:#2F3649;
  --fg:#EDEFF6; --muted:#9BA2B6; --faint:#666E85;
  --side:#10131B; --side-2:#1A1F2B; --side-fg:#EDEFF6; --side-muted:#8890A6;
  --com:#7189FF; --ops:#FF8B4A; --fin:#2CCB94;
  --ok:#2CCB94; --warn:#F0AE3A; --bad:#FF6B71; --info:#7189FF;
  --av0:#7189FF; --av1:#2CCB94; --av2:#FF8B4A; --av3:#B27DF5; --av4:#F2709E;
  --z-risco:#F2B935; --z-amassado:#FF6B71; --z-trinca:#A383FA; --z-base:#1F2533; --z-stroke:#4A5369;
  --on-acc:#FFFFFF; --deep:#05070D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0C12; --surface:#12151E; --surface-2:#161A24; --surface-3:#1C2130; --line:#222838; --line-2:#2F3649;
  --fg:#EDEFF6; --muted:#9BA2B6; --faint:#666E85;
  --side:#10131B; --side-2:#1A1F2B; --side-fg:#EDEFF6; --side-muted:#8890A6;
  --com:#7189FF; --ops:#FF8B4A; --fin:#2CCB94;
  --ok:#2CCB94; --warn:#F0AE3A; --bad:#FF6B71; --info:#7189FF;
  --av0:#7189FF; --av1:#2CCB94; --av2:#FF8B4A; --av3:#B27DF5; --av4:#F2709E;
  --z-risco:#F2B935; --z-amassado:#FF6B71; --z-trinca:#A383FA; --z-base:#1F2533; --z-stroke:#4A5369;
  --on-acc:#FFFFFF; --deep:#05070D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{--acc:var(--com);display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.app[data-dept="operacional"]{--acc:var(--ops)}
.app[data-dept="financeiro"]{--acc:var(--fin)}

/* painel lateral */
.side{background:var(--side);color:var(--side-fg);position:sticky;top:calc(12px + env(safe-area-inset-top,0px));height:calc(100vh - 24px);margin:12px 0 12px max(12px,env(safe-area-inset-left,0px));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--on-acc);background:linear-gradient(140deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--deep)));box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent);transition:background .3s}
.logo svg.i{width:18px;height:18px;stroke-width:2.1}
.brand b{font:650 17px/1 var(--f-display);letter-spacing:-.01em}
.brand div span{display:block;font:500 11px/1.3 var(--f-body);color:var(--side-muted);margin-top:2px}
.depts{display:flex;flex-direction:column;gap:4px;background:var(--side-2);padding:5px;border-radius:14px}
.dept{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:8px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--side-fg);transition:background .15s,box-shadow .15s}
.dept:hover{background:color-mix(in srgb,var(--side) 60%,transparent)}
.dept .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--dc);background:color-mix(in srgb,var(--dc) 13%,transparent)}
.dept small{display:block;font:500 11px/1.2 var(--f-body);color:var(--side-muted)}
.dept strong{font:600 14px/1.25 var(--f-display);letter-spacing:-.005em}
.dept .st{font:500 10.5px/1 var(--f-mono);color:var(--side-muted);border:1px solid var(--line-2);border-radius:6px;padding:3px 5px}
.dept[aria-current="true"]{background:var(--side);box-shadow:var(--shadow-md)}
.dept[aria-current="true"] .n{background:var(--dc);color:var(--on-acc)}
.dept[aria-current="true"] .st{border-color:var(--dc);color:var(--dc)}
.dept.d1{--dc:var(--com)} .dept.d2{--dc:var(--ops)} .dept.d3{--dc:var(--fin)}
.flowline{display:none}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .lbl{font:500 11px/1 var(--f-body);color:var(--side-muted);padding:4px 10px 10px;letter-spacing:.02em}
.menu button{display:flex;align-items:center;gap:11px;background:none;border:0;text-align:left;padding:9px 10px;border-radius:10px;color:var(--side-muted);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.menu button:hover{color:var(--side-fg);background:var(--side-2)}
.menu button[aria-current="true"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.menu button.cta{margin-top:6px;color:var(--side-fg);border:1px dashed var(--line-2)}
.menu button.cta:hover{border-color:var(--acc);color:var(--acc);background:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);display:flex;flex-direction:column;gap:10px}
.demo{background:var(--side-2);border-radius:12px;padding:10px 12px;line-height:1.45}
.demo b{display:block;color:var(--side-fg);font-weight:600;margin-bottom:2px}
.who{display:flex;align-items:center;gap:10px;padding:4px 4px 0}
.who div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.who b{color:var(--side-fg);font-weight:600;font-size:13px}

/* avatares */
.av{--c:var(--av0);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:600 11.5px/1 var(--f-body);color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);flex:none;letter-spacing:.02em}
.av.sm{width:26px;height:26px;font-size:10px}
.av.solid{background:var(--acc);color:var(--on-acc)}
.av.c1{--c:var(--av1)} .av.c2{--c:var(--av2)} .av.c3{--c:var(--av3)} .av.c4{--c:var(--av4)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person>span:last-child{min-width:0}

/* área principal */
.main{padding-block:0 110px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:22px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;padding-block:14px;margin-top:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.search{flex:1 1 auto;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px 0 12px;box-shadow:var(--shadow);color:var(--faint)}
.search input{border:0!important;background:transparent!important;box-shadow:none!important;padding:9px 0!important;min-height:40px;flex:1;min-width:0;color:var(--fg)}
.kbd{font:500 11px/1 var(--f-mono);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;color:var(--faint);white-space:nowrap}
.topbar .sp{flex:1}
.datechip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:40px;white-space:nowrap}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.bell:hover{color:var(--fg)}
.bell i{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead>div{min-width:0}
.eyebrow{font:500 12.5px/1 var(--f-body);color:var(--acc);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.eyebrow .ex{color:var(--muted);background:var(--surface-3);padding:3px 8px;border-radius:999px;font-size:11.5px}
h1{font:650 30px/1.15 var(--f-display);margin:10px 0 0;letter-spacing:-.025em;text-wrap:balance}
h2{font:600 18px/1.25 var(--f-display);margin:0;letter-spacing:-.015em}
h3{font:600 14.5px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;color:var(--fg)}
.sub{margin:6px 0 0;color:var(--muted);max-width:68ch}
.phead-r{display:flex;gap:8px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);cursor:pointer;font-size:12.5px;margin-bottom:12px}
.crumb:hover{color:var(--fg);border-color:var(--line-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.span2{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-height:40px;transition:border-color .15s,box-shadow .15s}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--fg) 25%,var(--line-2))}
input:disabled,select:disabled{background-color:var(--surface-2);opacity:.75;cursor:not-allowed}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
input.num{text-align:right}
.read{padding:9px 12px;background:var(--surface-2);border-radius:10px;min-height:40px;overflow-wrap:anywhere;display:flex;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:9px 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap;min-height:40px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .15s,border-color .15s,filter .15s}
.btn:hover{border-color:color-mix(in srgb,var(--fg) 30%,var(--line-2))}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc));border-color:transparent;color:var(--on-acc);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px color-mix(in srgb,var(--acc) 32%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{color:var(--fg);background:var(--surface-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.3);transform:none}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:6px 9px;border-radius:8px}
.icon-btn:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-3);padding:4px;border-radius:12px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;min-height:32px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-md)}
.seg.status button[aria-pressed="true"].s-and{color:var(--info)}
.seg.status button[aria-pressed="true"].s-gan{color:var(--ok)}
.seg.status button[aria-pressed="true"].s-per{color:var(--bad)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:550;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.ok{--c:var(--ok)} .chip.warn{--c:var(--warn)} .chip.bad{--c:var(--bad)} .chip.info{--c:var(--info)} .chip.neu{--c:var(--muted)}
.tag{font:500 12px/1 var(--f-body);padding:5px 9px;border-radius:8px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.plate{font:600 11.5px/1 var(--f-mono);letter-spacing:.1em;padding:5px 8px;border-radius:7px;background:var(--fg);color:var(--surface);white-space:nowrap}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi .k{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}
.kpi .v{font:650 27px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpi .d{font-size:12.5px;color:var(--faint)}
.kpi.hl{border-color:transparent;color:var(--on-acc);background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--acc) 70%,#fff) 0%,transparent 55%),linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 50%,var(--deep)));box-shadow:0 14px 30px color-mix(in srgb,var(--acc) 28%,transparent)}
.kpi.hl .k,.kpi.hl .d{color:color-mix(in srgb,var(--on-acc) 80%,transparent)}
.kpi.hl .ki{background:rgba(255,255,255,.18);color:var(--on-acc)}
.kpi.hl .v{color:var(--on-acc)!important}
.spark{position:absolute;right:0;bottom:0;width:58%;height:56px;opacity:.9;pointer-events:none}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,var(--surface)),var(--acc));border-radius:999px}
.bar-row .vl{font-variant-numeric:tabular-nums;min-width:100px;text-align:right;font-weight:550}

/* filtros e tabelas */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select,.filters input{width:auto;min-width:170px}
.filters .grow{flex:1 1 240px}
.kpi .meter{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.kpi .meter i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.kpi.lost .ki{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.kpi.lost .v{color:var(--bad)}
.bar-fill.lost{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 55%,var(--surface)),var(--bad))}
.chart{width:100%;min-width:460px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--faint);font:500 11px var(--f-body)}
.chart .ax.mo{fill:var(--muted);font-size:12px}
.chart .vl{fill:var(--muted);font:600 11px var(--f-body)}
.chart .vl-proj{fill:var(--acc);font:700 11px var(--f-body)}
.chart .b-fat{fill:var(--acc)}
.chart .b-per{fill:var(--bad);opacity:.8}
.chart .b-proj{fill:color-mix(in srgb,var(--acc) 14%,transparent);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 3}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-fat{background:var(--acc)} .lg-per{background:var(--bad)} .lg-proj{border:1.5px dashed var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tabbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.tabbar .filters select{min-width:0}
.kpis:has(> :nth-child(4)){grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1240px){ .kpis:has(> :nth-child(4)){grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .kpis:has(> :nth-child(4)){grid-template-columns:minmax(0,1fr)} }

    ag:{entrada:'', saida:''}, motivo:'', resumo:'', obs:'', anexos:[], os:null, op:null, fin:null};
}
function mk(o){
  const b = base();
  for (const k in o){
    if (o[k] && typeof o[k]==='object' && !Array.isArray(o[k]) && b[k] && typeof b[k]==='object' && !Array.isArray(b[k])) Object.assign(b[k], o[k]);
    else b[k] = o[k];
  }
  return b;
}
const sv = (cod,qtd=1) => { const c = CATALOGO.find(x=>x.cod===cod); return {cod, desc:c.desc, qtd, valor:c.valor}; };
const subtotal = r => r.servicos.reduce((s,x)=>s+(+x.qtd||0)*(+x.valor||0),0);
const total = r => Math.max(0, subtotal(r)-(+r.desconto||0));
const saldo = r => Math.max(0, total(r)-(+r.pag.entrada||0));
const recebido = r => r.fin ? r.fin.titulos.filter(t=>t.recebido).reduce((s,t)=>s+t.valor,0) : 0;
const aReceber = r => r.fin ? r.fin.titulos.filter(t=>!t.recebido).reduce((s,t)=>s+t.valor,0) : saldo(r);

function gerarTitulos(r){
  const t = [], e = +r.pag.entrada||0;
  if (e>0) t.push({desc:'Entrada', valor:e, forma:r.pag.formaEntrada, venc:r.pag.dataEntrada||r.data, recebido:!!r.pag.entradaPaga, dataRec:r.pag.entradaPaga?(r.pag.dataEntrada||r.data):''});
  const s = saldo(r), n = r.pag.quando==='retirada' ? 1 : Math.max(1, +r.pag.parcelas||1), baseD = r.ag.saida||HOJE;
  if (s>0){
    const p = Math.floor(s/n*100)/100;
    for (let i=0;i<n;i++){
      const v = i===n-1 ? Math.round((s-p*(n-1))*100)/100 : p;
      t.push({desc: n===1 ? (r.pag.quando==='retirada'?'Saldo na retirada':'Saldo') : `Parcela ${i+1}/${n}`, valor:v, forma:r.pag.formaSaldo, venc:addMes(baseD,i), recebido:false, dataRec:''});
    }
  }
  return t;
}

}

function numeros(L){
  const gan = L.filter(r=>r.status==='Ganho'), and = L.filter(r=>r.status==='Andamento'), per = L.filter(r=>r.status==='Perdido');
  const fat = gan.reduce((s,r)=>s+total(r),0), bruto = and.reduce((s,r)=>s+total(r),0);
  const prev = and.reduce((s,r)=>s+total(r)*(PROB[r.etapa]??0),0), perV = per.reduce((s,r)=>s+total(r),0);

}

    ${ticket?`<div class="kpi"><span class="k"><i class="ki">${ico('receipt')}</i>Ticket médio</span><span class="v">${fmt(n.gan.length?n.fat/n.gan.length:0)}</span><span class="d">em negociação: ${fmt(n.bruto)}</span></div>`:''}
  </div>`;
}
function chartMeses(){
  const out = numeros(DB.filter(r=>r.data.startsWith('2026-10')));
  const M = [...HIST.map(h=>({...h})), {m:'Out', fat:out.fat, per:out.perV, proj:out.proj}];
  const W = 640, H = 250, pl = 56, pr = 12, pt = 16, pb = 30, top = Math.ceil(Math.max(...M.map(x=>Math.max(x.fat,x.per,x.proj||0)))/25000)*25000 || 25000;
  const y = v => pt + (H-pt-pb)*(1 - v/top), gw = (W-pl-pr)/M.length, bw = Math.min(34, gw/3.2);
  const ticks = []; for (let t=0; t<=top; t+=25000) ticks.push(t);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturado, projeção e perdido por mês">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${pl-8}" y="${y(t)+4}" class="ax" text-anchor="end">${t?Math.round(t/1000)+' mil':'0'}</text>`).join('')}
    ${M.map((d,i)=>{ const cx = pl + gw*i + gw/2, x1 = cx - bw - 3, x2 = cx + 3;
      return `${d.proj?`<rect x="${x1}" y="${y(d.proj)}" width="${bw}" height="${y(d.fat)-y(d.proj)}" rx="5" class="b-proj"><title>Projeção ${fmt(d.proj)}</title></rect>
        <text x="${x1+bw/2}" y="${y(d.proj)-6}" class="vl-proj" text-anchor="middle">${Math.round(d.proj/1000)}k</text>`:''}
        <rect x="${x1}" y="${y(d.fat)}" width="${bw}" height="${y(0)-y(d.fat)}" rx="5" class="b-fat"><title>Faturado ${fmt(d.fat)}</title></rect>
        <rect x="${x2}" y="${y(d.per)}" width="${bw}" height="${y(0)-y(d.per)}" rx="5" class="b-per"><title>Perdido ${fmt(d.per)}</title></rect>
        ${d.proj?'':`<text x="${x1+bw/2}" y="${y(d.fat)-6}" class="vl" text-anchor="middle">${Math.round(d.fat/1000)}k</text>`}
        <text x="${x2+bw/2}" y="${y(d.per)-6}" class="vl" text-anchor="middle">${Math.round(d.per/1000)}k</text>
        <text x="${cx}" y="${H-8}" class="ax mo" text-anchor="middle">${d.m}${d.proj?' (atual)':''}</text>`; }).join('')}
  </svg>`;
}

function spark(gan){
  const dias = 21, acc = []; let s = 0;
  for (let d=1; d<=dias; d++){ const k = '2026-10-'+String(d).padStart(2,'0'); s += gan.filter(r=>r.data===k).reduce((t,r)=>t+total(r),0); acc.push(s); }
  const max = Math.max(1, s), W = 200, H = 56, pts = acc.map((v,i)=>[i/(dias-1)*W, H-4-(v/max)*(H-12)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line} L${W} ${H} L0 ${H} Z" fill="rgba(255,255,255,.14)"/>
    <path d="${line}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function finChip(r){
  if (r.fin.liberado) return chip('ok','Financeiro liberou');
  if (r.fin.titulos.some(t=>t.desc==='Entrada'&&!t.recebido)) return chip('bad','Entrada não confirmada');
  const p = aReceber(r);
  if (p>0 && r.pag.quando==='retirada') return chip('warn','Saldo na retirada '+fmt(p));
  if (p>0) return chip('info','Parcelado · '+fmt(p)+' a receber');
  return chip('info','Pago · aguardando liberação');
}

VIEWS.dre = () => {
  const vendas = DB.filter(r=>r.os && r.data.startsWith('2026-10'));
  const bruta = vendas.reduce((s,r)=>s+subtotal(r),0), desc = vendas.reduce((s,r)=>s+(+r.desconto||0),0);
  const impostos = Math.round((bruta-desc)*0.06*100)/100;
  const cartao = vendas.flatMap(r=>r.fin.titulos).filter(t=>t.forma.startsWith('Cartão')).reduce((s,t)=>s+t.valor,0);
  const taxa = Math.round(cartao*0.029*100)/100;
  const liq = bruta-desc-impostos-taxa;
  const cat = c => PAGAR.filter(p=>p.cat===c && p.venc.startsWith('2026-10')).reduce((s,p)=>s+p.valor,0);
  const mat = cat('Materiais'), lucroB = liq-mat;
  const desp = [['Pessoal',cat('Pessoal')],['Ocupação',cat('Ocupação')],['Marketing',cat('Marketing')],['Administrativo',cat('Administrativo')]];
  const totDesp = desp.reduce((s,d)=>s+d[1],0), res = lucroB-totDesp;
  const pc = v => bruta ? (v/bruta*100).toFixed(1).replace('.',',')+'%' : '—';
  const line = (n,v,cls='',neg=false) => `<tr class="${cls}"><td>${n}</td><td class="num ${neg&&v?'neg':''}">${neg&&v?'− ':''}${fmt(Math.abs(v))}</td><td class="num faint">${pc(Math.abs(v))}</td>
    <td style="width:22%"><div class="minibar" style="width:${bruta?Math.min(100,Math.abs(v)/bruta*100):0}%;${neg?'background:var(--bad)':''}"></div></td></tr>`;
  return head('Relatório e DRE', 'Demonstração do resultado de outubro de 2026 por competência. As receitas vêm das vendas fechadas e as despesas das contas a pagar.',
      `<select id="dre-m" aria-label="Mês"><option>Outubro de 2026</option><option disabled>Setembro de 2026</option></select>`) + `
  <div class="kpis">
    <div class="kpi"><span class="k"><i class="ki">${ico('trend')}</i>Receita líquida</span><span class="v">${fmt(liq)}</span><span class="d">${vendas.length} vendas</span></div>
    <div class="kpi"><span class="k"><i class="ki">${ico('coins')}</i>Lucro bruto</span><span class="v">${fmt(lucroB)}</span><span class="d">margem ${pc(lucroB)}</span></div>
    <div class="kpi hl"><span class="k"><i class="ki">${ico('chart')}</i>Resultado do mês</span><span class="v" style="color:${res<0?'var(--bad)':'var(--ok)'}">${fmt(res)}</span><span class="d">margem ${pc(res)}</span></div>
  </div>
  <div class="tbl-wrap"><table class="tbl dre"><thead><tr><th>Conta</th><th class="num">Valor</th><th class="num">% receita</th><th></th></tr></thead><tbody>
    ${line('Receita bruta de serviços', bruta, 'grp')}
    ${line('Descontos concedidos', desc, 'ind', true)}
    ${line('Impostos sobre vendas (Simples Nacional 6%)', impostos, 'ind', true)}
    ${line('Taxas de cartão (2,9%)', taxa, 'ind', true)}
    ${line('Receita líquida', liq, 'grp')}
    ${line('Materiais aplicados (PPF, películas, produtos)', mat, 'ind', true)}
    ${line('Lucro bruto', lucroB, 'grp')}
    ${desp.map(([n,v])=>line(n, v, 'ind', true)).join('')}
    ${line('Despesas operacionais', totDesp, 'grp', true)}
    ${line('Resultado do período', res, 'res', res<0)}
  </tbody></table></div>`;
};

    <div class="lines"><div></div><div></div></div>
    <div class="sig"><div>${esc(r.consultor)}<br>Wingard</div><div>${esc(r.cliente.nome)}<br>Cliente</div></div>
  </div>`;
}
function docPrisma(r){
  return `<div class="doc">
    <div class="dt"><span class="big">Nº ${r.os}</span><span class="big">Data ${fdate(r.data)}</span></div>
    <div class="row" style="margin-top:8px"><span><b>Cliente:</b> ${esc(r.cliente.nome.toUpperCase())}</span><span><b>Tel:</b> ${esc(r.cliente.tel)}</span></div>
    <div class="row"><span><b>Veículo:</b> ${esc(r.veiculo.modelo)}</span><span><b>Placa:</b> ${esc(r.veiculo.placa)}</span><span><b>Km:</b> ${esc(r.op.chkIn.km)}</span><span><b>Ano:</b> ${esc(r.veiculo.ano)}</span><span><b>Chassi:</b> ${esc(r.veiculo.chassi)}</span></div>
    ${r.resumo?`<div class="cap">Agendamento</div><div>${esc(r.resumo).replace(/\n/g,'<br>')}</div>`:''}
    ${r.obs?`<div class="cap">Observações</div><div>${esc(r.obs)}</div>`:''}
    <h4>Produtos e Serviços</h4>
    <table><thead><tr><th>Código</th><th>Referência</th><th>Descrição</th><th>End.</th><th class="r">Qtd</th><th>Executor</th></tr></thead><tbody>
      ${r.servicos.map((s,i)=>`<tr><td>${s.cod}</td><td></td><td>${esc(s.desc.toUpperCase())}</td><td></td><td class="r">${s.qtd}</td><td>${esc(r.op.exec[i]||'')}</td></tr>`).join('')}
    </tbody></table>
    <div class="sig"><div>${esc(r.consultor.toUpperCase())}<br>Responsável</div><div>${esc(r.cliente.nome.toUpperCase())}<br>Autorização do cliente</div></div>
    <h4>Observações</h4>
    <div class="lines"><div></div><div></div><div></div><div></div><div></div></div>
  </div>`;
}
function abrirDoc(tipo, r = cur()){
  const m = $('#modal');
  m.innerHTML = `<div class="modal-in"><div class="modal-bar"><span><b>${tipo==='os'?'Ordem de Serviço':'Prisma'} ${r.os}</b> · folha A4<br><small style="opacity:.75">No link de visualização do Claude a impressora pode ficar bloqueada. Abrindo o arquivo no navegador, imprime normalmente.</small></span>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="doc" data-id="${r.id}" data-t="${tipo==='os'?'prisma':'os'}">Ver ${tipo==='os'?'Prisma':'OS'}</button><button class="btn sm" data-a="fecharModal">Fechar</button><button class="btn sm pri" data-a="imprimir" data-id="${r.id}" data-t="${tipo}">${ico('print')}Imprimir</button></span></div>
    ${tipo==='os'?docOS(r):docPrisma(r)}</div>`;
  m.hidden = false;
}

/* ======================= AÇÕES ======================= */
function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  for (let i=0;i<ks.length-1;i++){ if (o[ks[i]]==null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length-1]] = val;
}
const ACT = {
  dept: a => { const d = a.dataset.d; go(d, DEPTS[d].menu[0][0]); },
  nav: a => go(S.dept, a.dataset.v),
  open: a => go(a.dataset.d, a.dataset.v, a.dataset.id),
  fset: a => { S.f[a.dataset.k] = a.dataset.val; render(); },
  status: a => { const r = cur(); r.status = a.dataset.s; if (r.status==='Ganho' && !['Fechamento','Pós-venda'].includes(r.etapa)) r.etapa='Fechamento'; render();
    if (r.status==='Ganho' && !r.os) toast('Status ganho. Use “Fechar venda e gerar OS” para enviar ao Operacional e ao Financeiro.','warn'); },
  canal: a => { cur().canal = a.dataset.c; render(); },
  addSvc: () => { cur().servicos.push(sv('111')); render(); },
  rmSvc: a => { cur().servicos.splice(+a.dataset.i,1); render(); },
  salvar: () => toast('Atendimento salvo.'),
  fechar: () => {
    const r = cur(), falta = [];
    if (!r.cliente.nome) falta.push('nome do cliente');
    if (!r.cliente.tel) falta.push('telefone');
    if (!r.veiculo.modelo) falta.push('veículo');
    if (!r.servicos.length) falta.push('pelo menos um serviço');
    if (!r.ag.entrada || !r.ag.saida) falta.push('datas de entrada e saída');
    if (falta.length) return toast('Para fechar a venda, preencha: '+falta.join(', ')+'.','bad');
    gerarOS(r); render(); window.scrollTo(0,0);
    toast(`Venda fechada. OS ${r.os} criada no Operacional e recebimentos lançados no Financeiro.`);
  },
  sino: () => { const p = ordens().filter(r=>!r.fin.liberado && (r.op.etapa==='pronto' || r.fin.titulos.some(t=>t.desc==='Entrada'&&!t.recebido)));
    toast(p.length ? 'Avisos: '+p.map(r=>`OS ${r.os} ${r.op.etapa==='pronto'?'pronta, aguardando o Financeiro':'com entrada não confirmada'}`).join(' · ') : 'Nenhum aviso agora.', p.length?'warn':''); },
  voltar: a => { const r = DB.find(x=>x.id===a.dataset.id), i = PATIO.findIndex(p=>p[0]===r.op.etapa); if (i>0) moverEtapa(r, PATIO[i-1][0]); },
  avancar: a => { const r = DB.find(x=>x.id===a.dataset.id), i = PATIO.findIndex(p=>p[0]===r.op.etapa); moverEtapa(r, PATIO[i+1][0]); },
  setEtapa: a => moverEtapa(DB.find(x=>x.id===a.dataset.id), a.dataset.e),
  tab: a => { S.tab = a.dataset.t; render(); },
  verPerdidos: () => { S.f.st = 'Perdido'; S.f.etapa = 'todas'; S.f.q = ''; go('comercial','atendimentos'); },
  ptab: a => { S.ptab = a.dataset.t; render(); },
  zona: a => { const r = cur(), c = S.tab==='out' ? r.op.chkOut : r.op.chkIn, z = a.dataset.z;
    c.avarias[z] = AVARIAS[(AVARIAS.indexOf(c.avarias[z]||'')+1) % AVARIAS.length]; render(); },
  comb: a => { cur().op[a.dataset.k].comb = a.dataset.c; render(); },
  concluirChk: a => { const r = cur(), c = r.op[a.dataset.k]; c.concluido = true;
    if (a.dataset.k==='chkIn' && r.op.etapa==='aguardando') r.op.etapa = 'lavagem';
    render(); toast(a.dataset.k==='chkIn' ? `Checklist de entrada concluído. OS ${r.os} foi para Lavagem.` : `Checklist de saída concluído.${r.fin.liberado?' Veículo pode ser entregue.':' Falta a liberação do Financeiro.'}`, r.fin.liberado||a.dataset.k==='chkIn'?'':'warn'); },
  doc: a => abrirDoc(a.dataset.t, a.dataset.id ? DB.find(x=>x.id===a.dataset.id) : cur()),
  imprimir: a => { const r = DB.find(x=>x.id===a.dataset.id); abrirDoc(a.dataset.t, r);
    r.op.impresso = r.op.impresso || {}; r.op.impresso[a.dataset.t] = HOJE;
    setTimeout(()=>{ try { window.print(); } catch(e){} }, 60);
    if (S.view==='impressao') render(); },
  fecharModal: () => { $('#modal').hidden = true; },
  receber: a => { const r = cur(), t = r.fin.titulos[+a.dataset.i]; t.recebido = !t.recebido; t.dataRec = t.recebido ? HOJE : '';
    if (!t.recebido) r.fin.liberado = false; render(); if (t.recebido) toast(`${t.desc} de ${fmt(t.valor)} confirmada no caixa.`); },
  liberar: () => { const r = cur(); r.fin.liberado = !r.fin.liberado; render();
    toast(r.fin.liberado ? `OS ${r.os} liberada. O Operacional já vê a liberação no pátio.` : 'Liberação cancelada.', r.fin.liberado?'':'warn'); },
  pagar: a => { const p = PAGAR[+a.dataset.i]; p.pago = !p.pago; render(); },
  addPagar: () => {
    const d = $('#np-d').value.trim(), v = parseFloat($('#np-x').value.replace(/\./g,'').replace(',','.'));
    if (!d || !(v>0)) return toast('Informe a descrição e o valor da conta.','bad');
    PAGAR.push({desc:d, forn:$('#np-f').value.trim()||'—', cat:$('#np-c').value, venc:$('#np-v').value||HOJE, valor:v, pago:false});
    S.f.pag = 'aberto'; render(); toast('Conta lançada.');
  },
};
function moverEtapa(r, etapa){
  const i = PATIO.findIndex(p=>p[0]===etapa);
  if (etapa!=='aguardando' && !r.op.chkIn.concluido) return toast(`Faça o checklist de entrada da OS ${r.os} antes de mover o veículo.`,'bad');
  if (etapa==='entregue' && !r.op.chkOut.concluido) return toast(`Entrega bloqueada: falta o checklist de saída da OS ${r.os}.`,'bad');
  if (etapa==='entregue' && !r.fin.liberado) return toast(`Entrega bloqueada: o Financeiro ainda não liberou a OS ${r.os}. A receber: ${fmt(aReceber(r))}.`,'bad');
  const de = PATIO.findIndex(p=>p[0]===r.op.etapa);
  if (de===i) return;
  (r.op.hist = r.op.hist || []).unshift({de:PATIO[de][1], para:PATIO[i][1], volta:i<de, quem:DEPTS[S.dept].user, hora:new Date().toTimeString().slice(0,5)});
  r.op.etapa = etapa; render();
  toast(i<de ? `OS ${r.os} voltou para ${PATIO[i][1]}.` : `OS ${r.os} agora está em ${PATIO[i][1]}.`, i<de?'warn':'');
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
  if (a.tagName==='TR' && e.target.closest('button,select,input,a')) return;
  const f = ACT[a.dataset.a]; if (f){ e.preventDefault(); f(a, e); }
});
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key==='Escape') $('#modal').hidden = true; });

function onField(e){
  const el = e.target;
  if (el.dataset.f){ S.f[el.dataset.f] = el.value;
    if (el.dataset.f==='cq'){ const L = DB.filter(r=>noPeriodo(r.data,S.f.periodo) && (S.f.cons==='todos'||r.consultor===S.f.cons)), q = el.value.trim().toLowerCase();
      $('#tbl-cli').innerHTML = tblClientes(clientes(L).filter(c=>!q || (c.u.cliente.nome+' '+c.u.cliente.tel+' '+c.u.veiculo.modelo).toLowerCase().includes(q))); }
    else if (S.view==='atendimentos' && !el.dataset.rr){ $('#tbl').innerHTML = tblAtend(listaAtend()); } else if (e.type==='change') render();
    return; }
  if (el.dataset.up && e.type==='change'){
    const r = cur(), files = [...el.files], path = el.dataset.up.split('.');
    let arr = r; path.forEach(p=>arr = arr[p]);
    let n = files.length; if (!n) return;
    files.forEach(f => { const rd = new FileReader(); rd.onload = () => { arr.push({nome:f.name, src: f.type.startsWith('image/') ? rd.result : ''}); if (--n===0) render(); }; rd.readAsDataURL(f); });
    return; }
  if (el.dataset.svc!=null && e.type==='change'){
    const s = cur().servicos[+el.dataset.svc], c = CATALOGO.find(x=>x.cod===el.value); Object.assign(s, {cod:c.cod, desc:c.desc, valor:c.valor}); render(); return; }
  const p = el.dataset.b; if (!p) return;
  if (el.type==='checkbox' && e.type!=='change') return;
  let v = el.type==='checkbox' ? el.checked : el.value;
  if (el.dataset.t==='n') v = parseFloat(String(v).replace(',','.')) || 0;
  setPath(cur(), p, v);
  if (el.dataset.rr && e.type==='change') render(); else refreshFicha();
}
main.addEventListener('keydown', e => {
  if (e.target.id!=='busca' || e.key!=='Enter') return;
  const q = e.target.value.trim(), os = ordens().find(r=>String(r.os)===q.replace(/\D/g,'') && q.replace(/\D/g,''));
  if (os) return go(S.dept==='financeiro'?'financeiro':'operacional', S.dept==='financeiro'?'conf':'os', os.id);
  S.f.q = q; S.f.st = 'todos'; S.f.etapa = 'todas'; S.f.cons = 'todos'; go('comercial','atendimentos');
});
main.addEventListener('input', onField);
main.addEventListener('change', onField);

render();
</script>
