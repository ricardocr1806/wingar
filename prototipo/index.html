<title>Sistema Wingard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral fixa com os 3 departamentos (etapas 1→2→3) + área de trabalho; no celular a barra vira faixa no topo. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#DCE1E9; --line-2:#C8D0DB;
  --fg:#141A24; --muted:#5A6476; --faint:#8A93A3;
  --side:#121A27; --side-2:#1B2535; --side-fg:#E7ECF3; --side-muted:#8C98AB;
  --com:#2C58CF; --ops:#B8620E; --fin:#17845A;
  --ok:#17845A; --warn:#B36B00; --bad:#C2372F; --info:#2C58CF;
  --z-risco:#E0A21B; --z-amassado:#D2453C; --z-trinca:#7B4FD0; --z-base:#E4E9F0; --z-stroke:#9AA5B5;
  --paper:#FFFFFF; --ink:#1A1A1A; --ink-line:#BDBDBD;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1118; --surface:#141B25; --surface-2:#19212D; --line:#263142; --line-2:#334055;
  --fg:#E5EAF1; --muted:#98A3B5; --faint:#6C778A;
  --side:#090D13; --side-2:#141B25; --side-fg:#E5EAF1; --side-muted:#808CA0;
  --com:#7095FF; --ops:#EE9C46; --fin:#45C08A;
  --ok:#45C08A; --warn:#E9A93A; --bad:#F06B62; --info:#7095FF;
  --z-risco:#E9B235; --z-amassado:#EE6A60; --z-trinca:#9D7AF0; --z-base:#253041; --z-stroke:#5D6A80;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1118; --surface:#141B25; --surface-2:#19212D; --line:#263142; --line-2:#334055;
  --fg:#E5EAF1; --muted:#98A3B5; --faint:#6C778A;
  --side:#090D13; --side-2:#141B25; --side-fg:#E5EAF1; --side-muted:#808CA0;
  --com:#7095FF; --ops:#EE9C46; --fin:#45C08A;
  --ok:#45C08A; --warn:#E9A93A; --bad:#F06B62; --info:#7095FF;
  --z-risco:#E9B235; --z-amassado:#EE6A60; --z-trinca:#9D7AF0; --z-base:#253041; --z-stroke:#5D6A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{--acc:var(--com);display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.app[data-dept="operacional"]{--acc:var(--ops)}
.app[data-dept="financeiro"]{--acc:var(--fin)}

/* barra lateral */
.side{background:var(--side);color:var(--side-fg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:10px;padding:0 6px}
.brand b{font:700 24px/1 var(--f-display);letter-spacing:.14em}
.brand span{font:500 11px/1 var(--f-mono);color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
.depts{display:flex;flex-direction:column;gap:6px}
.dept{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:10px;padding:10px;border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:var(--side-fg)}
.dept:hover{background:var(--side-2)}
.dept .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--f-mono);border:1.5px solid var(--dc);color:var(--dc)}
.dept small{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
.dept strong{font:600 17px/1.2 var(--f-display);letter-spacing:.02em}
.dept[aria-current="true"]{background:var(--side-2);border-color:var(--dc)}
.dept[aria-current="true"] .n{background:var(--dc);color:var(--side)}
.dept.d1{--dc:var(--com)} .dept.d2{--dc:var(--ops)} .dept.d3{--dc:var(--fin)}
.flowline{margin:-2px 0 0 25px;height:10px;border-left:1.5px dashed var(--side-muted);opacity:.5}
.menu{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--side-2);padding-top:16px}
.menu .lbl{font:500 10.5px/1 var(--f-mono);color:var(--side-muted);text-transform:uppercase;letter-spacing:.1em;padding:0 10px 8px}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;color:var(--side-muted);cursor:pointer;font-weight:500;white-space:nowrap}
.menu button:hover{color:var(--side-fg);background:var(--side-2)}
.menu button[aria-current="true"]{color:var(--side-fg);background:var(--side-2);box-shadow:inset 3px 0 0 var(--acc)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--side-2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--side);display:grid;place-items:center;font:600 12px/1 var(--f-mono);flex:none}
.who div{display:flex;flex-direction:column;line-height:1.25}
.who b{color:var(--side-fg);font-weight:500;font-size:13px}

/* área principal */
.main{padding-block:28px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead>div{min-width:0}
.eyebrow{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--acc);display:flex;gap:8px;align-items:center}
.eyebrow .ex{color:var(--faint);border:1px solid var(--line-2);padding:2px 6px;border-radius:4px;letter-spacing:.06em}
h1{font:600 30px/1.1 var(--f-display);margin:8px 0 0;letter-spacing:.01em;text-wrap:balance}
h2{font:600 19px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
h3{font:600 12px/1 var(--f-mono);margin:0;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted);max-width:68ch}
.phead-r{display:flex;gap:8px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13px}
.crumb:hover{color:var(--fg)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.span2{grid-column:1/-1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px}
input:disabled,select:disabled{opacity:.65;cursor:not-allowed}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
input.num{text-align:right}
.read{padding:8px 0;border-bottom:1px dashed var(--line);min-height:38px;overflow-wrap:anywhere}

.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:9px 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:5px}
.icon-btn:hover{color:var(--bad);background:var(--surface-2)}

.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.seg.status button[aria-pressed="true"].s-and{background:var(--info);border-color:var(--info)}
.seg.status button[aria-pressed="true"].s-gan{background:var(--ok);border-color:var(--ok)}
.seg.status button[aria-pressed="true"].s-per{background:var(--bad);border-color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.ok{--c:var(--ok)} .chip.warn{--c:var(--warn)} .chip.bad{--c:var(--bad)} .chip.info{--c:var(--info)} .chip.neu{--c:var(--muted)}
.tag{font:500 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.plate{font:600 12px/1 var(--f-mono);letter-spacing:.08em;padding:4px 7px;border:1.5px solid var(--fg);border-radius:4px;white-space:nowrap}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:600 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .d{font-size:12px;color:var(--faint)}
.kpi.hl{border-color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--acc);border-radius:5px}
.bar-row .vl{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}

/* filtros e tabelas */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select,.filters input{width:auto;min-width:160px}
.filters .grow{flex:1 1 220px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:inherit}
.tbl th{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .cl b{display:block;font-weight:500}
.tbl .cl span{font-size:12px;color:var(--muted)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0}
.inner-tbl td,.inner-tbl th{padding:8px 6px}
.inner-tbl input,.inner-tbl select{min-height:34px;padding:6px 8px}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 18px;justify-content:end;margin-left:auto;min-width:260px;font-variant-numeric:tabular-nums}
.totals .t-big{font:600 22px/1.1 var(--f-display)}
.totals input{width:130px;text-align:right}

/* pátio */
.kanban-wrap{overflow-x:auto;padding-bottom:6px}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(236px,1fr));gap:12px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col-h b{font:600 15px/1 var(--f-display);letter-spacing:.03em}
.col-h span{font:500 12px/1 var(--f-mono);color:var(--muted)}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ocard .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ocard .os{font:600 13px/1 var(--f-mono);color:var(--acc)}
.ocard .car{font:600 16px/1.15 var(--f-display)}
.ocard .meta{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ocard .acts{display:flex;gap:6px;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.late{color:var(--bad);font-weight:500}
.empty{font-size:12.5px;color:var(--faint);text-align:center;padding:16px 4px;border:1px dashed var(--line-2);border-radius:8px}

.stepper{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stepper button{flex:1 0 auto;border:0;background:none;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:flex-start;border-right:1px solid var(--line);min-width:120px;text-align:left}
.stepper button:last-child{border-right:0}
.stepper small{font:500 10.5px/1 var(--f-mono);color:var(--faint);letter-spacing:.06em}
.stepper b{font:600 14.5px/1.1 var(--f-display);color:var(--muted);letter-spacing:.02em}
.stepper .done b{color:var(--fg)}
.stepper .done small{color:var(--acc)}
.stepper .now{background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:inset 0 -3px 0 var(--acc)}
.stepper .now b{color:var(--fg)}
.stepper .now small{color:var(--acc)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}

/* vistoria */
.vist{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.carbox{display:flex;flex-direction:column;gap:10px;align-items:center}
.carbox svg{width:100%;max-width:240px;height:auto}
.zone{fill:var(--z-base);stroke:var(--z-stroke);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.zone:hover{stroke:var(--fg);stroke-width:2}
.zone.risco{fill:var(--z-risco)} .zone.amassado{fill:var(--z-amassado)} .zone.trinca{fill:var(--z-trinca)}
.glass{fill:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--z-stroke)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);cursor:pointer;font-size:13.5px}
.ck input{width:17px;height:17px;accent-color:var(--acc);flex:none}
.ck:has(input:checked){border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.foto{aspect-ratio:4/3;border-radius:6px;border:1px solid var(--line);background:var(--surface-2) center/cover no-repeat;display:flex;align-items:flex-end;font:500 10.5px/1.2 var(--f-mono);color:var(--muted);padding:5px;overflow:hidden;max-width:100%}
.foto.ph{background-image:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 9px)}
.up{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:1.5px dashed var(--line-2);border-radius:6px;cursor:pointer;color:var(--muted);font-size:12.5px;text-align:center;padding:6px;max-width:100%}
.up:hover{border-color:var(--acc);color:var(--fg)}
.up input{display:none}
.avlist{display:flex;flex-direction:column;gap:4px;font-size:13px;width:100%}
.avlist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}

.note{border:1px solid var(--line);border-left:3px solid var(--c,var(--acc));background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:13.5px}
.note.warn{--c:var(--warn)} .note.ok{--c:var(--ok)} .note.bad{--c:var(--bad)}
.note b{display:block;font:600 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;color:var(--c,var(--acc))}
.reqs{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.reqs div{display:flex;gap:8px;align-items:center}
.reqs .y{color:var(--ok)} .reqs .n{color:var(--faint)}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sumline:last-child{border-bottom:0}
.sumline.big{font:600 18px/1.2 var(--f-display);border-bottom:0;padding-top:10px}
.actionbar{position:sticky;bottom:0;margin-top:4px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:5}
.actionbar .info{margin-right:auto;align-self:center;font-size:13px;color:var(--muted)}
.anexos{display:flex;flex-wrap:wrap;gap:8px}
.anexo{width:108px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.anexo .foto{width:108px}

/* DRE */
.dre td{padding:9px 12px}
.dre .grp td{font-weight:600;background:var(--surface-2)}
.dre .res td{font:600 17px/1.2 var(--f-display);border-top:2px solid var(--fg)}
.dre .ind td:first-child{padding-left:28px;color:var(--muted)}
.dre .neg{color:var(--bad)}
.minibar{height:6px;border-radius:3px;background:var(--acc);opacity:.7}

/* documento impresso */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--side) 72%,transparent);z-index:50;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.modal-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--side-fg);flex-wrap:wrap}
.modal-bar .btn{background:var(--surface);color:var(--fg)}
.doc{background:var(--paper);color:var(--ink);font:12px/1.45 var(--f-body);padding:36px 40px;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow-x:auto}
.doc h4{font:600 13px/1 var(--f-body);margin:18px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.doc .dt{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}

.doc .row{display:flex;flex-wrap:wrap;gap:4px 22px;margin:2px 0}

.doc .lines div{border-bottom:1px solid var(--ink-line);height:22px}
.doc .cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-top:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:8px;z-index:60;max-width:min(560px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;border-left:4px solid var(--tc,var(--ok))}

  const st = p => p.pago ? 'pago' : p.venc<HOJE ? 'vencido' : 'aberto';
  const L = PAGAR.map((p,i)=>({p,i})).filter(({p})=>f.pag==='todos' || (f.pag==='aberto' ? !p.pago : p.pago)).sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
  const ab = PAGAR.filter(p=>!p.pago).reduce((s,p)=>s+p.valor,0), vc = PAGAR.filter(p=>st(p)==='vencido').reduce((s,p)=>s+p.valor,0), pg = PAGAR.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);
  return head('Contas a pagar', 'Fornecedores, despesas fixas e equipe. Tudo entra na DRE por categoria.') + `
  <div class="kpis">
    <div class="kpi hl"><span class="k">Em aberto</span><span class="v">${fmt(ab)}</span><span class="d">${PAGAR.filter(p=>!p.pago).length} contas</span></div>
    <div class="kpi"><span class="k">Vencido</span><span class="v" style="color:${vc?'var(--bad)':'inherit'}">${fmt(vc)}</span><span class="d">pagar hoje</span></div>
    <div class="kpi"><span class="k">Pago em outubro</span><span class="v">${fmt(pg)}</span><span class="d">${PAGAR.filter(p=>p.pago).length} contas</span></div>
  </div>
  <section class="card"><h3>Nova conta</h3>
    <div class="fields">
      <div class="field"><label for="np-d">Descrição</label><input id="np-d" placeholder="Ex.: Rolo PPF fosco"></div>
      <div class="field"><label for="np-f">Fornecedor</label><input id="np-f"></div>
      <div class="field"><label for="np-c">Categoria</label><select id="np-c">${['Materiais','Ocupação','Pessoal','Marketing','Administrativo'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label for="np-v">Vencimento</label><input id="np-v" type="date" value="2026-10-31"></div>
      <div class="field"><label for="np-x">Valor (R$)</label><input id="np-x" class="num" inputmode="decimal" placeholder="0,00"></div>
    </div>
    <div><button class="btn pri" data-a="addPagar">Lançar conta</button></div></section>
  <div class="filters"><div class="seg">${[['aberto','Em aberto'],['pago','Pagas'],['todos','Todas']].map(([v,n])=>`<button data-a="fset" data-k="pag" data-val="${v}" aria-pressed="${f.pag===v}">${n}</button>`).join('')}</div></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Vencimento</th><th>Descrição</th><th>Fornecedor</th><th>Categoria</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
  ${L.map(({p,i})=>`<tr><td class="mono">${fdate(p.venc)}</td><td>${esc(p.desc)}</td><td class="muted">${esc(p.forn)}</td><td><span class="tag">${p.cat}</span></td><td class="num">${fmt(p.valor)}</td>
    <td>${st(p)==='pago'?chip('ok','Pago'):st(p)==='vencido'?chip('bad','Vencido'):chip('warn','Em aberto')}</td>
    <td>${p.pago?`<button class="btn sm ghost" data-a="pagar" data-i="${i}">Desfazer</button>`:`<button class="btn sm" data-a="pagar" data-i="${i}">Marcar como paga</button>`}</td></tr>`).join('') || `<tr><td colspan="7"><div class="empty">Nada por aqui.</div></td></tr>`}
  </tbody></table></div>`;
};
VIEWS.dre = () => {
  const vendas = DB.filter(r=>r.os && r.data.startsWith('2026-10'));
  const bruta = vendas.reduce((s,r)=>s+subtotal(r),0), desc = vendas.reduce((s,r)=>s+(+r.desconto||0),0);
  const impostos = Math.round((bruta-desc)*0.06*100)/100;
  const cartao = vendas.flatMap(r=>r.fin.titulos).filter(t=>t.forma.startsWith('Cartão')).reduce((s,t)=>s+t.valor,0);
  const taxa = Math.round(cartao*0.029*100)/100;
  const liq = bruta-desc-impostos-taxa;
  const cat = c => PAGAR.filter(p=>p.cat===c && p.venc.startsWith('2026-10')).reduce((s,p)=>s+p.valor,0);
  const mat = cat('Materiais'), lucroB = liq-mat;
  const desp = [['Pessoal',cat('Pessoal')],['Ocupação',cat('Ocupação')],['Marketing',cat('Marketing')],['Administrativo',cat('Administrativo')]];
  const totDesp = desp.reduce((s,d)=>s+d[1],0), res = lucroB-totDesp;
  const pc = v => bruta ? (v/bruta*100).toFixed(1).replace('.',',')+'%' : '—';
  const line = (n,v,cls='',neg=false) => `<tr class="${cls}"><td>${n}</td><td class="num ${neg&&v?'neg':''}">${neg&&v?'− ':''}${fmt(Math.abs(v))}</td><td class="num faint">${pc(Math.abs(v))}</td>
    <td style="width:22%"><div class="minibar" style="width:${bruta?Math.min(100,Math.abs(v)/bruta*100):0}%;${neg?'background:var(--bad)':''}"></div></td></tr>`;
  return head('Relatório e DRE', 'Demonstração do resultado de outubro de 2026 por competência. As receitas vêm das vendas fechadas e as despesas das contas a pagar.',
      `<select id="dre-m" aria-label="Mês"><option>Outubro de 2026</option><option disabled>Setembro de 2026</option></select>`) + `
  <div class="kpis">
    <div class="kpi"><span class="k">Receita líquida</span><span class="v">${fmt(liq)}</span><span class="d">${vendas.length} vendas</span></div>
    <div class="kpi"><span class="k">Lucro bruto</span><span class="v">${fmt(lucroB)}</span><span class="d">margem ${pc(lucroB)}</span></div>
    <div class="kpi hl"><span class="k">Resultado do mês</span><span class="v" style="color:${res<0?'var(--bad)':'var(--ok)'}">${fmt(res)}</span><span class="d">margem ${pc(res)}</span></div>
  </div>
  <div class="tbl-wrap"><table class="tbl dre"><thead><tr><th>Conta</th><th class="num">Valor</th><th class="num">% receita</th><th></th></tr></thead><tbody>
    ${line('Receita bruta de serviços', bruta, 'grp')}
    ${line('Descontos concedidos', desc, 'ind', true)}
    ${line('Impostos sobre vendas (Simples Nacional 6%)', impostos, 'ind', true)}
    ${line('Taxas de cartão (2,9%)', taxa, 'ind', true)}
    ${line('Receita líquida', liq, 'grp')}
    ${line('Materiais aplicados (PPF, películas, produtos)', mat, 'ind', true)}
    ${line('Lucro bruto', lucroB, 'grp')}
    ${desp.map(([n,v])=>line(n, v, 'ind', true)).join('')}
    ${line('Despesas operacionais', totDesp, 'grp', true)}
    ${line('Resultado do período', res, 'res', res<0)}
  </tbody></table></div>`;
};

/* ======================= DOCUMENTOS ======================= */

  const av = Object.entries(r.op.chkIn.avarias).filter(([,v])=>v);
  return `<div class="doc">

    <h4>Serviços</h4>

      ${r.servicos.map(s=>`<tr><td>${s.cod}</td><td>${esc(s.desc.toUpperCase())}</td><td class="r">${s.qtd}</td><td class="r">${fmt(s.valor)}</td><td class="r">${fmt(s.qtd*s.valor)}</td></tr>`).join('')}

      <tr><td colspan="4" class="r"><b>Total Venda:</b></td><td class="r"><b>${fmt(total(r))}</b></td></tr></tbody></table>
    <h4>Pagamentos</h4>
    <table><thead><tr><th>Data</th><th>Documento</th><th class="r">$ Parcela</th><th>Parcela(s)</th><th>Situação</th></tr></thead><tbody>
      ${t.map((x,i)=>`<tr><td>${fdate(x.venc)}</td><td>${esc(x.forma)} · ${x.desc}</td><td class="r">${fmt(x.valor)}</td><td>${i+1}/${n}</td><td>${x.recebido?'Pago':'Em aberto'}</td></tr>`).join('')}
      <tr><td colspan="2" class="r"><b>$ Total das Parcelas</b></td><td class="r"><b>${fmt(t.reduce((s,x)=>s+x.valor,0))}</b></td><td colspan="2"></td></tr></tbody></table>
    <h4>Consultores</h4>
    <div class="row"><span><b>Responsável:</b> ${esc(r.consultor.toUpperCase())}</span><span><b>Responsável técnico:</b> ${esc(r.op.tecnico.toUpperCase())}</span></div>
    <h4>Vistoria de entrada</h4>
    <div>${av.length?av.map(([k,v])=>`${ZONAS[k]}: ${AV_NOME[v]}`).join(' · '):'Sem avarias registradas.'} ${r.op.chkIn.comb?`· Combustível ${r.op.chkIn.comb}`:''}</div>
    <h4>Garantia</h4>
    <div>Garantia conforme o fabricante de cada produto aplicado, mediante apresentação desta OS.</div>

    <div class="lines"><div></div><div></div></div>
    <div class="sig"><div>${esc(r.consultor)}<br>Wingard</div><div>${esc(r.cliente.nome)}<br>Cliente</div></div>
  </div>`;

function abrirDoc(tipo){
  const r = cur(), m = $('#modal');
  m.innerHTML = `<div class="modal-in"><div class="modal-bar"><span><b>${tipo==='os'?'Ordem de Serviço':'Prisma'} ${r.os}</b> · pré-visualização da impressão em A4</span>
    <span style="display:flex;gap:8px"><button class="btn sm" data-a="doc" data-t="${tipo==='os'?'prisma':'os'}">Ver ${tipo==='os'?'Prisma':'OS'}</button><button class="btn sm" data-a="fecharModal">Fechar</button></span></div>
    ${tipo==='os'?docOS(r):docPrisma(r)}</div>`;

/* ======================= AÇÕES ======================= */
function setPath(obj, path, val){
  const ks = path.split('.'); let o = obj;
  for (let i=0;i<ks.length-1;i++){ if (o[ks[i]]==null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length-1]] = val;
}
const ACT = {
  dept: a => { const d = a.dataset.d; go(d, DEPTS[d].menu[0][0]); },
  nav: a => go(S.dept, a.dataset.v),
  open: a => go(a.dataset.d, a.dataset.v, a.dataset.id),
  fset: a => { S.f[a.dataset.k] = a.dataset.val; render(); },
  status: a => { const r = cur(); r.status = a.dataset.s; if (r.status==='Ganho' && !['Fechamento','Pós-venda'].includes(r.etapa)) r.etapa='Fechamento'; render();
    if (r.status==='Ganho' && !r.os) toast('Status ganho. Use “Fechar venda e gerar OS” para enviar ao Operacional e ao Financeiro.','warn'); },
  canal: a => { cur().canal = a.dataset.c; render(); },
  addSvc: () => { cur().servicos.push(sv('111')); render(); },
  rmSvc: a => { cur().servicos.splice(+a.dataset.i,1); render(); },
  salvar: () => toast('Atendimento salvo.'),
  fechar: () => {
    const r = cur(), falta = [];
    if (!r.cliente.nome) falta.push('nome do cliente');
    if (!r.cliente.tel) falta.push('telefone');
    if (!r.veiculo.modelo) falta.push('veículo');
    if (!r.servicos.length) falta.push('pelo menos um serviço');
    if (!r.ag.entrada || !r.ag.saida) falta.push('datas de entrada e saída');
    if (falta.length) return toast('Para fechar a venda, preencha: '+falta.join(', ')+'.','bad');
    gerarOS(r); render(); window.scrollTo(0,0);
    toast(`Venda fechada. OS ${r.os} criada no Operacional e recebimentos lançados no Financeiro.`);
  },
  avancar: a => { const r = DB.find(x=>x.id===a.dataset.id), i = PATIO.findIndex(p=>p[0]===r.op.etapa); moverEtapa(r, PATIO[i+1][0]); },
  setEtapa: a => moverEtapa(DB.find(x=>x.id===a.dataset.id), a.dataset.e),
  tab: a => { S.tab = a.dataset.t; render(); },
  zona: a => { const r = cur(), c = S.tab==='out' ? r.op.chkOut : r.op.chkIn, z = a.dataset.z;
    c.avarias[z] = AVARIAS[(AVARIAS.indexOf(c.avarias[z]||'')+1) % AVARIAS.length]; render(); },
  comb: a => { cur().op[a.dataset.k].comb = a.dataset.c; render(); },
  concluirChk: a => { const r = cur(), c = r.op[a.dataset.k]; c.concluido = true;
    if (a.dataset.k==='chkIn' && r.op.etapa==='aguardando') r.op.etapa = 'lavagem';
    render(); toast(a.dataset.k==='chkIn' ? `Checklist de entrada concluído. OS ${r.os} foi para Lavagem.` : `Checklist de saída concluído.${r.fin.liberado?' Veículo pode ser entregue.':' Falta a liberação do Financeiro.'}`, r.fin.liberado||a.dataset.k==='chkIn'?'':'warn'); },
  doc: a => abrirDoc(a.dataset.t),
  fecharModal: () => { $('#modal').hidden = true; },
  receber: a => { const r = cur(), t = r.fin.titulos[+a.dataset.i]; t.recebido = !t.recebido; t.dataRec = t.recebido ? HOJE : '';
    if (!t.recebido) r.fin.liberado = false; render(); if (t.recebido) toast(`${t.desc} de ${fmt(t.valor)} confirmada no caixa.`); },
  liberar: () => { const r = cur(); r.fin.liberado = !r.fin.liberado; render();
    toast(r.fin.liberado ? `OS ${r.os} liberada. O Operacional já vê a liberação no pátio.` : 'Liberação cancelada.', r.fin.liberado?'':'warn'); },
  pagar: a => { const p = PAGAR[+a.dataset.i]; p.pago = !p.pago; render(); },
  addPagar: () => {
    const d = $('#np-d').value.trim(), v = parseFloat($('#np-x').value.replace(/\./g,'').replace(',','.'));
    if (!d || !(v>0)) return toast('Informe a descrição e o valor da conta.','bad');
    PAGAR.push({desc:d, forn:$('#np-f').value.trim()||'—', cat:$('#np-c').value, venc:$('#np-v').value||HOJE, valor:v, pago:false});
    S.f.pag = 'aberto'; render(); toast('Conta lançada.');
  },
};
function moverEtapa(r, etapa){
  const i = PATIO.findIndex(p=>p[0]===etapa);
  if (etapa!=='aguardando' && !r.op.chkIn.concluido) return toast(`Faça o checklist de entrada da OS ${r.os} antes de mover o veículo.`,'bad');
  if (etapa==='entregue' && !r.op.chkOut.concluido) return toast(`Entrega bloqueada: falta o checklist de saída da OS ${r.os}.`,'bad');
  if (etapa==='entregue' && !r.fin.liberado) return toast(`Entrega bloqueada: o Financeiro ainda não liberou a OS ${r.os}. A receber: ${fmt(aReceber(r))}.`,'bad');
  r.op.etapa = etapa; render(); toast(`OS ${r.os} agora está em ${PATIO[i][1]}.`);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a || a.disabled) return;
  if (a.tagName==='TR' && e.target.closest('button,select,input,a')) return;
  const f = ACT[a.dataset.a]; if (f){ e.preventDefault(); f(a, e); }
});
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key==='Escape') $('#modal').hidden = true; });

function onField(e){
  const el = e.target;
  if (el.dataset.f){ S.f[el.dataset.f] = el.value;
    if (S.view==='atendimentos' && !el.dataset.rr){ $('#tbl').innerHTML = tblAtend(listaAtend()); } else if (e.type==='change') render();
    return; }
  if (el.dataset.up && e.type==='change'){
    const r = cur(), files = [...el.files], path = el.dataset.up.split('.');
    let arr = r; path.forEach(p=>arr = arr[p]);
    let n = files.length; if (!n) return;
    files.forEach(f => { const rd = new FileReader(); rd.onload = () => { arr.push({nome:f.name, src: f.type.startsWith('image/') ? rd.result : ''}); if (--n===0) render(); }; rd.readAsDataURL(f); });
    return; }
  if (el.dataset.svc!=null && e.type==='change'){
    const s = cur().servicos[+el.dataset.svc], c = CATALOGO.find(x=>x.cod===el.value); Object.assign(s, {cod:c.cod, desc:c.desc, valor:c.valor}); render(); return; }
  const p = el.dataset.b; if (!p) return;
  if (el.type==='checkbox' && e.type!=='change') return;
  let v = el.type==='checkbox' ? el.checked : el.value;
  if (el.dataset.t==='n') v = parseFloat(String(v).replace(',','.')) || 0;
  setPath(cur(), p, v);
  if (el.dataset.rr && e.type==='change') render(); else refreshFicha();
}
main.addEventListener('input', onField);
main.addEventListener('change', onField);

render();
</script>
